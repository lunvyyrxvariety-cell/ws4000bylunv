<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>WeatherSTAR 4000+</title>

<style>
@font-face {
  font-family: 'Star4000';
  src: url('https://wsbylunv.neocities.org/Star4000.ttf') format('truetype');
  font-display: block;
}

/* ============================================================ */
:root {
  --clock-top:   8px;
  --clock-right: 12px;
  --city-top:    100px;
  --city-right:  20px;
  --city-size:   1.3rem;
  --temp-top:    130px;
  --temp-left:   32px;
  --temp-size:   2.8rem;
  --cond-top:    210px;
  --cond-left:   32px;
  --cond-size:   1.3rem;
  --wind-top:    310px;
  --wind-left:   32px;
  --wind-size:   1.1rem;
  --details-top: 105px;
  --details-left:310px;
  --lbl-left:    0px;
  --lbl-size:    1.1rem;
  --val-offset:  160px;
  --val-size:    1.1rem;
  --row-height:  1.9rem;
  --bottom-size: 1.1rem;
}
/* ============================================================ */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Star4000", sans-serif !important;
}

body {
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

#screen {
  position: relative;
  width: 640px;
  height: 512px;
  background: url('https://wsbylunv.neocities.org/ws4000_bg.png') center/100% 100% no-repeat;
  background-color: #000a2a;
  overflow: hidden;
}

/* CLOCK */
#clock {
  position: absolute;
  top: var(--clock-top);
  right: var(--clock-right);
  text-align: right;
  color: #fff;
}
#clock .time { font-size: 1.2rem; }
#clock .date { font-size: 0.95rem; }

/* CITY */
#city-name {
  position: absolute;
  top: var(--city-top);
  right: var(--city-right);
  color: #ffe600;
  font-size: var(--city-size);
  text-align: right;
  max-width: 280px;
}

/* TEMP */
#cur-temp {
  position: absolute;
  top: var(--temp-top);
  left: var(--temp-left);
  color: #fff;
  font-size: var(--temp-size);
}

/* CONDITION */
#cur-cond {
  position: absolute;
  top: var(--cond-top);
  left: var(--cond-left);
  color: #fff;
  font-size: var(--cond-size);
}

/* WIND */
#cur-wind {
  position: absolute;
  top: var(--wind-top);
  left: var(--wind-left);
  color: #fff;
  font-size: var(--wind-size);
}

/* DETAILS */
#details {
  position: absolute;
  top: var(--details-top);
  left: var(--details-left);
  display: flex;
  flex-direction: column;
}

.drow {
  position: relative;
  height: var(--row-height);
  color: #fff;
}
.drow .lbl {
  position: absolute;
  left: var(--lbl-left);
  font-size: var(--lbl-size);
}
.drow .val {
  position: absolute;
  left: var(--val-offset);
  font-size: var(--val-size);
}

/* BOTTOM */
#bottom-text {
  position: absolute;
  bottom: 18px;
  left: 0;
  right: 0;
  text-align: center;
  color: #fff;
  font-size: var(--bottom-size);
}

/* SEARCH */
#search-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  z-index: 20;
}

#search-overlay input,
#inline-search input {
  background: rgba(0,0,20,0.85);
  border: 2px solid #4af;
  color: #4af;
  font-size: 1rem;
  padding: 6px 14px;
  outline: none;
}

#search-overlay button,
#inline-search button {
  background: #1a3fc4;
  color: #fff;
  border: 2px solid #4af;
  font-size: 1rem;
  padding: 6px 20px;
  cursor: pointer;
}

.blink { animation: blink 1.1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* FINAL LOCK (cannot be overridden) */
html, body, #screen, #screen *,
input, button, span, div, p {
  font-family: "Star4000", sans-serif !important;
}
</style>
</head>

<body>
<div id="screen">

<!-- Clock -->
<div id="clock">
  <div class="time" id="clock-time">--:-- --</div>
  <div class="date" id="clock-date">--- --- --</div>
</div>

<!-- Weather Data -->
<div id="weather-data" style="display:none;">
  <div id="city-name"></div>
  <div id="cur-temp"></div>
  <div id="cur-cond"></div>
  <div id="cur-wind">Wind: <span id="wind-val"></span></div>

  <div id="details">
    <div class="drow"><span class="lbl">Humidity:</span><span class="val" id="d-hum"></span></div>
    <div class="drow"><span class="lbl">Dewpoint:</span><span class="val" id="d-dew"></span></div>
    <div class="drow"><span class="lbl">Visibility:</span><span class="val" id="d-vis"></span></div>
    <div class="drow"><span class="lbl">Pressure:</span><span class="val" id="d-pres"></span></div>
    <div class="drow"><span class="lbl">Heat Index:</span><span class="val" id="d-hi"></span></div>
    <div class="drow"><span class="lbl">Wind Chill:</span><span class="val" id="d-wc"></span></div>
  </div>

  <div id="bottom-text">Conditions at <span id="bottom-city"></span></div>
</div>

</div>

<script>
async function forceStarFont() {
  try {
    await document.fonts.load('1em "Star4000"');
    await document.fonts.ready;

    document.body.style.setProperty("font-family", '"Star4000", sans-serif', "important");

    const all = document.querySelectorAll('*');
    for (const el of all) {
      el.style.setProperty('font-family', '"Star4000", sans-serif', 'important');
    }
  } catch (e) {
    console.warn("Star4000 font force failed:", e);
  }
}

window.addEventListener("load", forceStarFont);
</script>

</body>
</html>
