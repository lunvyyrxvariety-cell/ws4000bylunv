<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeatherStar 4000 - Regional Observations</title>
<style>
  @font-face {
    font-family: "Star4000";
    src: url("./fonts/Star4000.ttf") format("truetype");
  }
  * { font-family: "Star4000", monospace !important; margin:0; padding:0; box-sizing:border-box; }
  body { background:#111; height:100vh; display:flex; justify-content:center; align-items:center; overflow:hidden; }

  #map-screen {
    position:relative;
    width:1091px; height:820px;
    background-image:url('https://wsbylunv.neocities.org/ws4000wherediditgo.png'), url('https://raw.githubusercontent.com/lunvyyrx23/ws4000byaqzzyx/main/Basemap2.png');
    background-size:100% 100%, 100% 100%;
    flex-shrink:0; overflow:hidden;
  }

  .city-marker {
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center;
    pointer-events:none; z-index:10;
  }
  .city-dot {
    width:6px; height:6px;
    background:#fff; border-radius:50%;
    border:1px solid #000;
    box-shadow:0 0 3px rgba(0,0,0,0.9);
    flex-shrink:0;
  }
  .city-icon { width:40px; height:auto; image-rendering:pixelated; margin-top:2px; }
  .city-temp {
    color:#ffff00; font-size:14px; white-space:nowrap; line-height:1;
    text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;
  }
  .city-name {
    color:#fff; font-size:11px; white-space:nowrap; line-height:1;
    text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;
  }

  #scanlines {
    pointer-events:none; position:absolute; inset:0; z-index:200; opacity:0.5;
    background: repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 6px,rgba(0,0,0,0.7) 10px);
    animation: scanFlicker 6s linear infinite;
  }
  @keyframes scanFlicker {
    0%,100%{ opacity:0.45; } 35%{ opacity:0.52; } 55%{ opacity:0.40; } 75%{ opacity:0.55; }
  }

  #loading-msg {
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    color:#00ccff; font-size:20px; z-index:30;
    text-shadow:2px 2px 0 #000;
  }
</style>
</head>
<body>
<div id="map-screen">
  <div id="scanlines"></div>
  <div id="city-dots"></div>
  <div id="loading-msg">Loading weather data...</div>
</div>

<script>
const MAP_W = 1091, MAP_H = 820;
const BOUNDS = { minLon:-127.5, maxLon:-66.8, minLat:19.6, maxLat:50.2 };
const MANUAL_OFFSETS = {
  "Miami":         { x:842, y:712 },
  "Jacksonville":  { x:821, y:586 },
  "Key West":      { x:831, y:737 },
  "Bowling Green": { x:737, y:394 },
};

function mercY(lat) { return Math.log(Math.tan(Math.PI/4 + lat*Math.PI/360)); }
function project(lat, lon) {
  const x = (lon - BOUNDS.minLon) / (BOUNDS.maxLon - BOUNDS.minLon) * MAP_W;
  const yMin = mercY(BOUNDS.minLat), yMax = mercY(BOUNDS.maxLat);
  const y = (1 - (mercY(lat) - yMin) / (yMax - yMin)) * MAP_H;
  return {x, y};
}

const ICON_BASE = "https://wsbylunv.neocities.org/yea/";
function getIcon(txt, isDay) {
  txt = String(txt||"").toLowerCase();
  const has = s => txt.includes(s);
  if (has("thunder")) return ICON_BASE+"Scattered-Tstorms-1992.gif";
  if (has("snow")||has("flurries")) return ICON_BASE+"Snow.gif";
  if (has("sleet")||has("freezing")||has("mix")) return ICON_BASE+"Mixed.gif";
  if (has("rain")||has("shower")||has("drizzle")) return ICON_BASE+"Rain-1992.gif";
  if (has("fog")||has("mist")||has("haze")) return ICON_BASE+"Fog.gif";
  if (!isDay) {
    if (has("partly clear")) return ICON_BASE+"Partly-Clear.gif";
    if (has("mostly clear")) return ICON_BASE+"Mostly-Clear.gif";
    if (has("clear")||has("fair")) return ICON_BASE+"Clear.gif";
    if (has("partly cloudy")) return ICON_BASE+"Partly-Cloudy.gif";
    if (has("mostly cloudy")||has("partly sunny")) return ICON_BASE+"Mostly-Cloudy-2.gif";
  } else {
    if (has("partly sunny")) return ICON_BASE+"Mostly-Cloudy-2.gif";
    if (has("mostly sunny")) return ICON_BASE+"Mostly-Sunny.gif";
    if (has("partly cloudy")) return ICON_BASE+"Partly-Cloudy.gif";
    if (has("mostly cloudy")) return ICON_BASE+"Mostly-Cloudy-2.gif";
    if (has("sunny")||has("clear")||has("fair")) return ICON_BASE+"Sunny.gif";
  }
  if (has("cloudy")||has("overcast")) return ICON_BASE+"Cloudy.gif";
  return ICON_BASE+"Cloudy.gif";
}

const CITIES = [
  {name:"Atlanta",lat:33.749,lon:-84.388},{name:"Boston",lat:42.3584,lon:-71.0598},
  {name:"Chicago",lat:41.9796,lon:-87.9045},{name:"Cleveland",lat:41.4995,lon:-81.6954},
  {name:"Dallas",lat:32.8959,lon:-97.0372},{name:"Denver",lat:39.7391,lon:-104.9847},
  {name:"Detroit",lat:42.3314,lon:-83.0457},{name:"Hartford",lat:41.7637,lon:-72.6851},
  {name:"Houston",lat:29.7633,lon:-95.3633},{name:"Indianapolis",lat:39.7684,lon:-86.158},
  {name:"Los Angeles",lat:34.0522,lon:-118.2437},{name:"Miami",lat:25.7743,lon:-80.1937},
  {name:"Minneapolis",lat:44.98,lon:-93.2638},{name:"New York",lat:40.78,lon:-73.88},
  {name:"Norfolk",lat:36.8468,lon:-76.2852},{name:"Orlando",lat:28.5383,lon:-81.3792},
  {name:"Philadelphia",lat:39.9523,lon:-75.1638},{name:"Pittsburgh",lat:40.4406,lon:-79.9959},
  {name:"St. Louis",lat:38.6273,lon:-90.1979},{name:"San Francisco",lat:37.6148,lon:-122.3918},
  {name:"Seattle",lat:47.6062,lon:-122.3321},{name:"Syracuse",lat:43.0481,lon:-76.1474},
  {name:"Tampa",lat:27.9756,lon:-82.5329},{name:"Washington DC",lat:38.8951,lon:-77.0364},
  {name:"Albany",lat:42.6526,lon:-73.7562},{name:"Albuquerque",lat:35.0845,lon:-106.6511},
  {name:"Amarillo",lat:35.222,lon:-101.8313},{name:"Austin",lat:30.2671,lon:-97.7431},
  {name:"Baltimore",lat:39.2904,lon:-76.6122},{name:"Bangor",lat:44.8012,lon:-68.7778},
  {name:"Birmingham",lat:33.5207,lon:-86.8025},{name:"Bismarck",lat:46.8083,lon:-100.7837},
  {name:"Boise",lat:43.6135,lon:-116.2034},{name:"Buffalo",lat:42.8864,lon:-78.8784},
  {name:"Charleston SC",lat:32.7766,lon:-79.9309},{name:"Charleston WV",lat:38.3498,lon:-81.6326},
  {name:"Charlotte",lat:35.2271,lon:-80.8431},{name:"Cheyenne",lat:41.14,lon:-104.8202},
  {name:"Cincinnati",lat:39.162,lon:-84.4569},{name:"Columbia",lat:34.0007,lon:-81.0348},
  {name:"Columbus",lat:39.9612,lon:-82.9988},{name:"Des Moines",lat:41.6005,lon:-93.6091},
  {name:"Duluth",lat:46.7833,lon:-92.1066},{name:"El Paso",lat:31.7587,lon:-106.4869},
  {name:"Eugene",lat:44.0521,lon:-123.0867},{name:"Fargo",lat:46.8772,lon:-96.7898},
  {name:"Fresno",lat:36.7477,lon:-119.7724},{name:"Grand Rapids",lat:42.9634,lon:-85.6681},
  {name:"Helena",lat:46.5927,lon:-112.0361},{name:"Jackson",lat:32.2988,lon:-90.1848},
  {name:"Jacksonville",lat:30.3322,lon:-81.6556},{name:"Kansas City",lat:39.1142,lon:-94.6275},
  {name:"Key West",lat:24.5557,lon:-81.7826},{name:"Knoxville",lat:35.9606,lon:-83.9207},
  {name:"Las Vegas",lat:36.175,lon:-115.1372},{name:"Lincoln",lat:40.8,lon:-96.667},
  {name:"Louisville",lat:38.2542,lon:-85.7594},{name:"Memphis",lat:35.1495,lon:-90.049},
  {name:"Milwaukee",lat:43.0389,lon:-87.9065},{name:"Mobile",lat:30.6944,lon:-88.043},
  {name:"Nashville",lat:36.1659,lon:-86.7844},{name:"New Orleans",lat:29.9546,lon:-90.0751},
  {name:"Oklahoma City",lat:35.4676,lon:-97.5164},{name:"Omaha",lat:41.2586,lon:-95.9378},
  {name:"Phoenix",lat:33.4484,lon:-112.074},{name:"Pierre",lat:44.3683,lon:-100.351},
  {name:"Portland ME",lat:43.6615,lon:-70.2553},{name:"Portland OR",lat:45.5234,lon:-122.6762},
  {name:"Providence",lat:41.824,lon:-71.4128},{name:"Raleigh",lat:35.7721,lon:-78.6386},
  {name:"Reno",lat:39.4986,lon:-119.7681},{name:"Richmond",lat:37.5538,lon:-77.4603},
  {name:"Sacramento",lat:38.5816,lon:-121.4944},{name:"Salt Lake City",lat:40.7608,lon:-111.891},
  {name:"San Antonio",lat:29.4241,lon:-98.4936},{name:"San Diego",lat:32.7153,lon:-117.1573},
  {name:"Savannah",lat:32.0835,lon:-81.0998},{name:"Shreveport",lat:32.5251,lon:-93.7502},
  {name:"Sioux Falls",lat:43.55,lon:-96.7003},{name:"Spokane",lat:47.6597,lon:-117.4291},
  {name:"Toledo",lat:41.6639,lon:-83.5552},{name:"Tulsa",lat:36.154,lon:-95.9928},
  {name:"Wichita",lat:37.6922,lon:-97.3375},{name:"Tucson",lat:32.2216,lon:-110.9698},
  {name:"Lubbock",lat:33.5779,lon:-101.8552},{name:"Bowling Green",lat:36.9685,lon:-86.4808},
];

function placeMarker(city, temp, icon) {
  let {x, y} = project(city.lat, city.lon);
  if (MANUAL_OFFSETS[city.name]) { x = MANUAL_OFFSETS[city.name].x; y = MANUAL_OFFSETS[city.name].y; }
  if (x < 0 || x > MAP_W || y < 0 || y > MAP_H) return;

  const el = document.createElement("div");
  el.className = "city-marker";
  el.style.left = x + "px";
  el.style.top = y + "px";
  el.innerHTML = `
    <div class="city-dot"></div>
    <img class="city-icon" src="${icon}" alt="">
    <div class="city-temp">${temp}</div>
    <div class="city-name">${city.name}</div>
  `;
  document.getElementById("city-dots").appendChild(el);
}

async function loadAll() {
  const msg = document.getElementById("loading-msg");
  const batchSize = 6;
  let loaded = 0;

  for (let i = 0; i < CITIES.length; i += batchSize) {
    const batch = CITIES.slice(i, i + batchSize);
    await Promise.all(batch.map(async city => {
      try {
        const pData = await fetch(`https://api.weather.gov/points/${city.lat},${city.lon}`).then(r=>r.json());
        const fh = pData?.properties?.forecastHourly;
        if (!fh) throw new Error();
        const wData = await fetch(fh).then(r=>r.json());
        const now = wData?.properties?.periods?.[0];
        const temp = now?.temperature != null ? now.temperature + "°" : "--";
        const isDay = now?.isDaytime !== undefined ? !!now.isDaytime : true;
        const icon = getIcon(now?.shortForecast || "", isDay);
        placeMarker(city, temp, icon);
      } catch {
        placeMarker(city, "--", ICON_BASE+"Cloudy.gif");
      }
      loaded++;
      msg.textContent = `Loading... ${loaded}/${CITIES.length}`;
    }));
  }
  msg.textContent = "";
}

loadAll();
</script>
</body>
</html>
