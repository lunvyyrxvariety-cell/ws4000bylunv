<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WeatherStar 4000 - Golden Scroll (Single File)</title>

<style>
  @font-face {
    font-family: "Star4000";
    src: local("Star4000"), local("Star 4000"),
      url("https://wsbylunv.neocities.org/Star4000.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
  }

  * { font-family: "Star4000", monospace !important; margin: 0; padding: 0; box-sizing: border-box; }
  body { background:#111; height:100vh; display:flex; justify-content:center; align-items:center; overflow:hidden; }

  .ws-container{ transform: scale(var(--ui-scale)); transform-origin: top left; }
  body.mobile :root{}

  /* Minimal sidebar look */
  .sidebar{ width:210px; padding:14px; 
    position:relative; z-index:250 !important;
}
  .label, .tiny{ display:none !important; }
  input{ padding:8px; font-size:16px; }
  button{ padding:8px; font-size:14px; }
  .test-btn{ font-size:10px; padding:6px; }
  /* Fade layer */
  #fade-layer{ position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; z-index:95; transition: opacity 260ms ease; }
  #ws4000-screen.fading #fade-layer{ opacity:1; }


  #loading-screen{
    position:absolute; top:0; left:0; width:100%; height:100%;
    background:#000; color:#ffff00; font-size:45px;
    display:none; justify-content:center; align-items:center;
    z-index:100; text-shadow:3px 3px 0 #000;
  
    pointer-events:none;
}

  .ws-container{ display:flex; position:relative; }

  .sidebar{
    width:280px;
    background:linear-gradient(90deg,#001a33,#003366,#001a33);
    border-right:5px solid #000;
    padding:20px;
    z-index:10;
    height:820px;
  }

  .label{ color:#fff; font-size:14px; margin-top:15px; margin-bottom:5px; }
  input{
    width:100%; padding:10px; background:#000; border:2px solid #ffff00;
    color:#ffff00; font-size:18px; outline:none;
  }
  button{
    width:100%; margin-top:5px; padding:10px; background:#ffff00; color:#000;
    border:none; cursor:pointer; font-size:16px; font-weight:bold;
  }
  .test-btn{ background:#222; color:#aaa; font-size:11px; margin-bottom:4px; border:1px solid #444; width:100%; }
  #pause-btn{ background:#ff4444; color:#fff; margin-top:20px; }
  #mute-btn{ background:#444; color:#fff; margin-top:5px; }
  #scan-btn{ background:#0b3; color:#fff; margin-top:5px; }
  #force-refresh-btn{ background:#228; color:#fff; margin-top:5px; }
  .tiny{ font-size:12px; color:#00ccff; line-height:1.2; }

  #ws4000-screen{
    position:relative;
    width:1091px; height:820px;
    background-size:100% 100%;
    flex-shrink:0; overflow:hidden;
    background-image:url("https://wsbylunv.neocities.org/ws4000_bg.png");
    transition:background-position 1.2s ease-in-out, background-size 1.2s ease-in-out;
  }

  #ws4000-screen.travel-bg{ background-image:url("https://wsbylunv.neocities.org/ws4000travel.png") !important; }

  .outline-text{
    text-shadow:
      -3px -3px 0 #000,
       3px -3px 0 #000,
      -3px  3px 0 #000,
       3px  3px 0 #000,
       4px  4px 4px rgba(0,0,0,0.8);
  }

  .header{
    color:#ffff00; font-size:55px; position:absolute; top:50px; left:350px;
    line-height:1.1; z-index:5;
  }

  .location-label{
    color:#ffff00; font-size:38px; position:absolute; top:220px; right:120px;
    text-align:right; width:650px;
  }

  #current-content, #obs-table, #hourly-content, #travel-content { display:none; }

  #temp-value{ color:#fff; font-size:140px; position:absolute; top:200px; left:125px; }
  #weather-icon{ position:absolute; top:385px; left:125px; width:180px; image-rendering:pixelated; }
  .icon-subtext{ position:absolute; top:585px; left:125px; color:#fff; font-size:35px; white-space:pre; }
  .condition-label{ color:#fff; font-size:30px; position:absolute; top:335px; left:130px; }

  .stats-box{
    color:#fff; font-size:34px; line-height:1.35;
    position:absolute; top:290px; right:315px;
    width:380px;
  }

  #obs-table{ position:absolute; top:180px; left:110px; width:870px; color:#ffff00; font-size:38px; }
  .obs-row{ display:grid; grid-template-columns:320px 100px 280px 170px; margin-bottom:20px; }

  /* ===== Vertical scroll window (pages 3 & 4) =====
     user request: ~250px tall, centered-ish on bg */
  #hourly-content, #travel-content{
    width:930px; height:500px;
    position:absolute; top:150px; left:80px;
    overflow:hidden;
  }
  .scroll-window{
    position:absolute; inset:0;
    overflow:hidden;
  }
  .scroll-inner{
    display:flex;
    flex-direction:column;
    will-change:transform;
  }
  .scroll-inner.scrolling {
    animation: ws4000-vscroll var(--scroll-duration, 20s) linear infinite;
  }
  @keyframes ws4000-vscroll {
    0%   { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }
  body.paused .scroll-inner{ animation-play-state: paused; }

  .row-style{ display:grid; font-size:38px; height:60px; align-items:center; color:#ffff00; }
  .hourly-row{ grid-template-columns:220px 90px 260px 160px; }
  .travel-row{ grid-template-columns:340px 90px 160px 160px; }

  .temp-num{ color:#ffff00; min-width:80px; text-align:right; margin-right:40px; }
  .low-num{ color:#ffff00; min-width:80px; text-align:right; }
  .list-icon{ width:85px; height:auto; image-rendering:pixelated; }

  /* =========================
     SCANLINES OVERLAY (toggle)
  ========================= */
  #scanlines{
    pointer-events:none;
    position:absolute; inset:0;
    z-index:200;
    opacity:0.5;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.0) 0px,
        rgba(0,0,0,0.0) 6px,
        rgba(0,0,0,0.7) 10px
      );
    animation: scanFlicker 6s linear infinite;
  }

  #scanlines::after{
    content:"";
    position:absolute; inset:-40%;
    background: linear-gradient(to bottom,
      rgba(255,255,255,0.00),
      rgba(255,255,255,0.04),
      rgba(255,255,255,0.00)
    );
    transform: translateY(-30%);
    animation: scanRoll 7s linear infinite;
    opacity:0.7;
  
    pointer-events:none !important;
}

  @keyframes scanFlicker{
    0%,100%{ opacity:0.33; }
    35%{ opacity:0.37; }
    55%{ opacity:0.30; }
    75%{ opacity:0.40; }
  }
  @keyframes scanRoll{
    0%{ transform: translateY(-35%); }
    100%{ transform: translateY(35%); }
  }

  body.scan-off #scanlines{ display:none; }

  /* =========================
     THEME OVERRIDES
     default: Modern (black/white)
  ========================= */
  body.modern { background:#0b0b0b; }
  body.modern .sidebar{
    background:#0b0b0b !important;
    border-right:2px solid #222 !important;
  }
  body.modern .label{ color:#eaeaea; letter-spacing:0.5px; }
  body.modern input{
    background:#000; border:1px solid #666; color:#fff;
  }
  body.modern button{

  }
  body.modern .test-btn{
    background:#111; color:#fff; border:1px solid #333;
  }
  body.modern #pause-btn{ background:#fff; color:#000; }
  body.modern #mute-btn{ background:#111; color:#fff; border:1px solid #333; }
  body.modern #scan-btn{ background:#111; color:#fff; border:1px solid #333; }
  body.modern #force-refresh-btn{ background:#111; color:#fff; border:1px solid #333; }
  body.modern .tiny{ color:#b9b9b9; }

  body.ws4000 { background:#111; }
  body.ws4000 .sidebar{
    background:linear-gradient(90deg,#001a33,#003366,#001a33) !important;
    border-right:5px solid #000 !important;
  }
  body.ws4000 input{ border:2px solid #ffff00; color:#ffff00; }
  body.ws4000 button{ background:#ffff00; color:#000; }
  body.ws4000 .test-btn{ background:#222; color:#aaa; border:1px solid #444; }
  body.ws4000 .tiny{ color:#00ccff; }

</style>
</head>

<script>
/* =========================

========================= */

      {"id": "KLAX", "name": "LOS ANGELES", "x": 15, "y": 75},
      {"id": "KPHX", "name": "PHOENIX", "x": 45, "y": 80}

  }
};

/* =========================
   GLOBALS / STATE
========================= */
const screen = document.getElementById("ws4000-screen");
const audioPlayer = document.getElementById("bg-audio");
const musicInfo = document.getElementById("music-info");

let currentCoords = { lat: 35.22, lon: -80.84 };
let isPaused = false;
let loopTimer = null;
let muted = false;
let scanOn = true;

let pageList = ["current", "local-obs", "hourly", "travel", "regional-obs"];
let pageIndex = 0;

let hourlyData = [];
let travelDataCache = [];
let latestObs = null;
let currentStationId = null;
let currentStationName = null;

let pointMeta = { forecastHourlyUrl: null, stationsUrl: null };
let lastForecastUpdateStamp = null;
let lastObsUpdateStamp = null;

const POLL_MINS = 2;
document.getElementById("poll-mins").innerText = String(POLL_MINS);
let pollTimer = null;

let isDaytimeNow = true; // derived from NWS hourly periods[0].isDaytime when available

/* =========================
   Music (kept simple)
========================= */
const safeDefaultPlaylist = [
  { name: "Catch the Sun", url: "https://raw.githubusercontent.com/netbymatt/ws4kp-music/main/Catch%20the%20Sun.mp3" },
  { name: "Crisp Day", url: "https://raw.githubusercontent.com/netbymatt/ws4kp-music/main/Crisp%20day.mp3" },
  { name: "Downpour", url: "https://raw.githubusercontent.com/netbymatt/ws4kp-music/main/Downpour.mp3" },
  { name: "Fall Colors", url: "https://raw.githubusercontent.com/netbymatt/ws4kp-music/main/Fall%20colors.mp3" },
  { name: "Moonlit Sky", url: "https://raw.githubusercontent.com/netbymatt/ws4kp-music/main/Moonlit%20sky.mp3" },
  { name: "Rolling Clouds", url: "https://raw.githubusercontent.com/netbymatt/ws4kp-music/main/Rolling%20Clouds.mp3" },
  { name: "Spring Shower", url: "https://raw.githubusercontent.com/netbymatt/ws4kp-music/main/Spring%20Shower.mp3" },
  { name: "Strong Breeze", url: "https://raw.githubusercontent.com/netbymatt/ws4kp-music/main/Strong%20Breeze.mp3" }
];
let playlist = [...safeDefaultPlaylist];
let shuffledQueue = [];
let currentMusicIndex = 0;
let musicStarted = false;

function shuffleMusic() { shuffledQueue = [...playlist].sort(() => Math.random() - 0.5); currentMusicIndex = 0; }
function playNextTrack() {
  if (!shuffledQueue.length || currentMusicIndex >= shuffledQueue.length) shuffleMusic();
  const track = shuffledQueue[currentMusicIndex++];
  audioPlayer.src = track.url;
  audioPlayer.muted = muted;
  audioPlayer.play()
    .then(() => { musicInfo.innerText = (track.name || "PLAYING").toUpperCase(); })
    .catch(() => { musicInfo.innerText = "CLICK Update FOR AUDIO"; });
}
audioPlayer.onended = playNextTrack;
function toggleMute() {
  muted = !muted;
  audioPlayer.muted = muted;
  document.getElementById("mute-btn").innerText = muted ? "UNMUTE Music" : "MUTE Music";
}

/* =========================
   SCANLINES TOGGLE
========================= */
function toggleScanlines() {
  scanOn = !scanOn;
  document.body.classList.toggle("scan-off", !scanOn);
  document.getElementById("scan-btn").innerText = scanOn ? "Scanlines: On" : "Scanlines: Off";
  document.getElementById("scan-btn").style.background = scanOn ? "#0b3" : "#555";
}

/* =========================
   CORE UTILITIES
========================= */
function startLoop() {
  if (isPaused) return;
  clearTimeout(loopTimer);
  const page = pageList[pageIndex];
  const delay = (page === "hourly" || page === "travel") ? 30000 : 12000;
  loopTimer = setTimeout(nextPage, delay);
}
function nextPage() {
  if (isPaused) return;
  pageIndex = (pageIndex + 1) % pageList.length;
  setPage(pageList[pageIndex]);
  startLoop();
}
function togglePause() {
  isPaused = !isPaused;
  document.body.classList.toggle("paused", isPaused);
  const btn = document.getElementById("pause-btn");
  btn.innerText = isPaused ? "RESUME EMULATOR" : "Pause Emulator";
  if (isPaused) clearTimeout(loopTimer);
  else startLoop();
}
function forcePage(page) {
  clearTimeout(loopTimer);
  pageIndex = Math.max(0, pageList.indexOf(page));
  setPage(page);
  startLoop();
}
function showOnly(idsToShow) {
  const all = ["current-content", "obs-table", "hourly-content", "travel-content", "regional-content"];
  all.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = idsToShow.includes(id) ? "block" : "none";
  });
}

function titleCase(str){
  str = String(str || "").trim().toLowerCase();
  return str.replace(/\b([a-z])/g, (m, c) => c.toUpperCase());
}
function titleCaseCond(str){
  return titleCase(str).replace(/\bMph\b/g, "mph");
}
function formatCityLabel(input){
  const s = String(input || "").trim();
  if (!s) return "--";
  const parts = s.split(",").map(p=>p.trim()).filter(Boolean);
  if (parts.length >= 2){
    return titleCase(parts[0]) + ", " + parts[1].toUpperCase();
  }
  return titleCase(s);
}

/* Theme */
function setTheme(t){
  const body = document.body;
  body.classList.toggle("modern", t === "modern");
  body.classList.toggle("ws4000", t === "ws4000");
  try { localStorage.setItem("ws_theme", t); } catch {}
  // button emphasis
  const mBtn = document.getElementById("theme-modern");
  const wBtn = document.getElementById("theme-ws");
  if (mBtn && wBtn){
    mBtn.style.opacity = (t === "modern") ? "1" : "0.65";
    wBtn.style.opacity = (t === "ws4000") ? "1" : "0.65";
  }
}
function initTheme(){
  let t = "modern";
  try { t = localStorage.getItem("ws_theme") || "modern"; } catch {}
  setTheme(t);
}

/* =========================
   ICON LOGIC (your rules)
   - Day: "partly sunny" -> mostly cloudy
   - Day: "partly cloudy" -> mostly sunny
   - Night: clear icons only if truly night (NWS isDaytime=false)
   - Night: partly clear -> mostly cloudy
   - Night: mostly clear -> partly cloudy
========================= */
function iconUrl(name) {
  // All icons live under /yea (single folder)
  const base = "https://wsbylunv.neocities.org/yea/";
  return base + name;
}

function getGifName(txt, isList = false, isDay = true) {
  const baseUrl = "https://wsbylunv.neocities.org/yea/";
  txt = String(txt || "").toLowerCase();
  const night = !isDay;
  const has = (s) => txt.includes(s);

  // Precip / hazards first
  if (has("thunder") || has("t-storm") || has("tstorm")) return baseUrl + "Scattered-Tstorms-1992.gif";
  if (has("tornado")) return baseUrl + "Tornado.gif";
  if (has("hurricane")) return baseUrl + "Hurricane.gif";
  if (has("snow") || has("flurries")) return baseUrl + "Snow.gif";
  if (has("sleet") || has("ice pellets") || has("freezing rain") || has("wintry mix") || has("mix"))
    return baseUrl + "Mixed.gif";
  if (has("rain") || has("showers") || has("drizzle")) return baseUrl + "Rain-1992.gif";
  if (has("fog") || has("mist") || has("haze")) return baseUrl + "Fog.gif";

  if (!night) {
    // Day rules
    if (has("partly sunny"))  return baseUrl + "Mostly-Cloudy-2.gif";   // same as mostly cloudy
    if (has("mostly sunny"))  return baseUrl + "Mostly-Sunny.gif";
    if (has("partly cloudy")) return baseUrl + "Partly-Cloudy.gif";
    if (has("mostly cloudy")) return baseUrl + "Mostly-Cloudy-2.gif";
    if (has("mostly clear"))  return baseUrl + "Mostly-Sunny.gif";
    if (has("sunny") || has("clear") || has("fair")) return baseUrl + "Sunny.gif";
  } else {
    // Night rules
    if (has("partly clear"))  return baseUrl + "Partly-Clear.gif";
    if (has("mostly clear"))  return baseUrl + "Mostly-Clear.gif";
    if (has("clear") || has("fair")) return baseUrl + "Clear.gif";
    if (has("partly cloudy")) return baseUrl + "Partly-Cloudy.gif";
    if (has("mostly cloudy") || has("partly sunny")) return baseUrl + "Mostly-Cloudy-2.gif";
  }

  if (has("mostly cloudy")) return baseUrl + "Mostly-Cloudy-2.gif";
  if (has("partly cloudy")) return baseUrl + "Partly-Cloudy.gif";
  if (has("cloudy") || has("overcast")) return baseUrl + "Cloudy.gif";

  return baseUrl + "Cloudy.gif";
}

function mphFromKph(kph) { if (kph == null || Number.isNaN(kph)) return null; return Math.round(kph * 0.621371); }
function fFromC(c) { if (c == null || Number.isNaN(c)) return null; return Math.round((c * 9/5) + 32); }
function ftFromM(m) { if (m == null || Number.isNaN(m)) return null; return Math.round(m * 3.28084); }

function calcWindChillF(tempF, windMph) {
  if (tempF == null || windMph == null) return null;
  if (tempF > 50) return null;
  if (windMph <= 3) return null;
  const v16 = Math.pow(windMph, 0.16);
  const wc = 35.74 + 0.6215*tempF - 35.75*v16 + 0.4275*tempF*v16;
  return Math.round(wc);
}

function ceilingFromObs(obsProps) {
  const layers = obsProps?.cloudLayers;
  if (!Array.isArray(layers) || !layers.length) return "--";
  const ceilingKinds = new Set(["BKN", "OVC", "VV"]);
  const ceilingLayers = layers
    .filter(l => ceilingKinds.has((l?.amount || "").toUpperCase()) && l?.base?.value != null)
    .map(l => ftFromM(l.base.value))
    .filter(v => v != null);
  if (!ceilingLayers.length) return "UNLM";
  return Math.min(...ceilingLayers) + " FT";
}

/* =========================
   MORE ACCURATE REGIONAL PAN + MORE ZOOM
========================= */
const BASEMAP_BOUNDS = { minLon:-125.0, maxLon:-66.5, minLat:24.0, maxLat:49.5 };
const BASEMAP_ZOOM = 560;
const OFFSET_X_PCT = 0;
const OFFSET_Y_PCT = 0;

function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }
function mercY(latDeg) {
  const lat = clamp(latDeg, -85, 85) * Math.PI / 180;
  return Math.log(Math.tan(Math.PI / 4 + lat / 2));
}
function latLonToBasemapPosition(lat, lon) {
  const xNorm = (lon - BASEMAP_BOUNDS.minLon) / (BASEMAP_BOUNDS.maxLon - BASEMAP_BOUNDS.minLon);
  const yMin = mercY(BASEMAP_BOUNDS.minLat);
  const yMax = mercY(BASEMAP_BOUNDS.maxLat);
  const yNow = mercY(lat);
  const yNorm = (yMax - yNow) / (yMax - yMin);
  const edge = clamp((100 / BASEMAP_ZOOM) * 160, 1.5, 10);
  const xPct = clamp(xNorm * 100 + OFFSET_X_PCT, edge, 100 - edge);
  const yPct = clamp(yNorm * 100 + OFFSET_Y_PCT, edge, 100 - edge);
  return { xPct, yPct };
}

async function renderLocalObs() {
  const obsRows = document.getElementById("obs-rows");
  obsRows.innerHTML = `<div style="padding:40px;color:#fff;">LOADING NEARBY STATIONS...</div>`;

  try {
    if (!pointMeta.stationsUrl) throw new Error("No stations URL");

    const stationsData = await fetch(pointMeta.stationsUrl, { cache:"no-store" }).then(r=>r.json());
    const stations = stationsData?.features?.slice(0, 7) || [];

    const rows = await Promise.all(stations.map(async (st, i) => {
      const id = st.properties?.stationIdentifier;
      const stationName = st.properties?.name || id;
      // Only city part (before first comma)
      const city = titleCase(String(stationName).split(",")[0].trim());

      try {
        const obs = await fetch(`https://api.weather.gov/stations/${id}/observations/latest`, { cache:"no-store" }).then(r=>r.json());
        const p = obs?.properties;
        const temp = p?.temperature?.value != null ? fFromC(p.temperature.value) + "°" : "--";
        const cond = titleCaseCond(p?.textDescription || "--");
        const windMph = p?.windSpeed?.value != null ? mphFromKph(p.windSpeed.value) : null;
        const windDir = p?.windDirection?.value != null ? Math.round(p.windDirection.value) + "°" : null;
        const wind = (windMph != null && windDir != null) ? `${windDir} ${windMph}mph` : "--";
        return { city, temp, cond, wind };
      } catch {
        return { city, temp: "--", cond: "--", wind: "--" };
      }
    }));

    obsRows.innerHTML = rows.map(r => `
      <div style="display:grid; grid-template-columns:280px 100px 300px 210px; margin-bottom:18px; color:#ffff00; font-size:34px;">
        <div style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${r.city}</div>
        <div>${r.temp}</div>
        <div style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${r.cond}</div>
        <div style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${r.wind}</div>
      </div>
    `).join("");
  } catch(e) {
    obsRows.innerHTML = `<div style="padding:40px;color:#fff;">NO OBSERVATION DATA.</div>`;
  }
}

function haversineMiles(lat1, lon1, lat2, lon2){
  const R = 3958.8;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;
  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

async function nwsQuickNow(lat, lon){
  // Use points -> forecastHourly first period (works well enough)
  const p = await fetch(`https://api.weather.gov/points/${lat},${lon}`, { cache:"no-store" }).then(r=>r.json());
  const url = p?.properties?.forecastHourly;
  if (!url) return { temp:"--", cond:"N/A", icon:getGifName("Cloudy", true) };
  const f = await fetch(url, { cache:"no-store" }).then(r=>r.json());
  const now = f?.properties?.periods?.[0];
  const temp = (typeof now?.temperature === "number") ? (now.temperature + "°") : "--";
  const cond = now?.shortForecast || "N/A";
  return { temp, cond, icon:getGifName(cond, true) };
}

function projectToMiniMap(lat, lon, w, h){
  // Contiguous US-ish bounds for Basemap2.png
  const bounds = { minLat: 22.0, maxLat: 54.0, minLon: -130.0, maxLon: -65.0 };
  const x = (lon - bounds.minLon) / (bounds.maxLon - bounds.minLon) * w;
  const y = (bounds.maxLat - lat) / (bounds.maxLat - bounds.minLat) * h;
  return { x, y };
}

let regDataCache = null;
let regLoading = false;

async function renderRegionalObs() {
  const dotsDiv = document.getElementById("regional-dots");
  if (regDataCache) { drawRegionalDots(regDataCache); return; }
  if (regLoading) return;
  regLoading = true;
  dotsDiv.innerHTML = "";

  // Fetch all cities in batches of 6
  const results = [];
  const batchSize = 6;
  for (let i = 0; i < REG_CITIES.length; i += batchSize) {
    const batch = REG_CITIES.slice(i, i + batchSize);
    const batchResults = await Promise.all(batch.map(async city => {
      try {
        const pData = await fetch(`https://api.weather.gov/points/${city.lat},${city.lon}`).then(r=>r.json());
        const fh = pData?.properties?.forecastHourly;
        if (!fh) throw new Error("no forecast");
        const wData = await fetch(fh).then(r=>r.json());
        const now = wData?.properties?.periods?.[0];
        const temp = now?.temperature != null ? now.temperature + "°" : "--";
        const isDay = now?.isDaytime !== undefined ? !!now.isDaytime : true;
        const icon = getGifName(now?.shortForecast || "", true, isDay);
        return { ...city, temp, icon };
      } catch {
        return { ...city, temp: "--", icon: getGifName("Cloudy", true, true) };
      }
    }));
    results.push(...batchResults);
    drawRegionalDots(results); // draw progressively as batches come in
  }

  regDataCache = results;
  regLoading = false;
}

function drawRegionalDots(cities) {
  const dotsDiv = document.getElementById("regional-dots");
  if (!dotsDiv) return;
  dotsDiv.innerHTML = "";

  cities.forEach(city => {
    let {x, y} = regProject(city.lat, city.lon);
    if (MANUAL_OFFSETS[city.name]) { x = MANUAL_OFFSETS[city.name].x; y = MANUAL_OFFSETS[city.name].y; }
    if (x < 0 || x > REG_W || y < 0 || y > REG_H) return;

    const el = document.createElement("div");
    el.style.cssText = `position:absolute; left:${x}px; top:${y}px; transform:translate(-50%,-50%);
      display:flex; flex-direction:column; align-items:center; pointer-events:none; z-index:10;`;

    const dot = document.createElement("div");
    dot.style.cssText = `width:6px; height:6px; background:#fff; border-radius:50%;
      border:1px solid #000; box-shadow:0 0 3px rgba(0,0,0,0.9); flex-shrink:0;`;

    const img = document.createElement("img");
    img.src = city.icon;
    img.style.cssText = `width:40px; height:auto; image-rendering:pixelated; margin-top:2px;`;

    const temp = document.createElement("div");

/* =========================
   DATA FETCH
   - accepts "lat,lon" OR "City, ST"
   - City geocode uses Nominatim (NWS has no city->lat/lon endpoint)
========================= */
async function fetchWithRetry(url, attempts = 3) {
  for (let i = 0; i < attempts; i++) {
    try {
      const r = await fetch(url);
      if (r.ok) return r.json();
      throw new Error(`HTTP ${r.status}`);
    } catch(e) {
      if (i === attempts - 1) throw e;
      await new Promise(res => setTimeout(res, 1500)); // wait 1.5s before retry
    }
  }
}

async function parseInputToLatLon(raw) {
  const s = String(raw || "").trim();
  if (!s) throw new Error("Empty location");

  // Lat, Lon direct entry
  const ll = s.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
  if (ll) {
    return { lat: parseFloat(ll[1]), lon: parseFloat(ll[2]), label: formatCityLabel(s) };
  }

  // Try US Census geocoder first
  try {
    const url = `https://geocoding.geo.census.gov/geocoder/locations/onelineaddress?address=${encodeURIComponent(s)}&benchmark=2020&format=json`;
    const j = await fetch(url).then(r => r.json());
    const match = j?.result?.addressMatches?.[0];
    if (match?.coordinates) {
      const lat = parseFloat(match.coordinates.y);
      const lon = parseFloat(match.coordinates.x);
      const label = formatCityLabel(match.matchedAddress || s);
      if (Number.isFinite(lat) && Number.isFinite(lon)) return { lat, lon, label };
    }
  } catch (_) {}

  // Fallback: Nominatim
  try {
    const nUrl = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(s)}`;
    const n = await fetch(nUrl).then(r => r.json());
    const hit = Array.isArray(n) ? n[0] : null;
    if (hit?.lat && hit?.lon) {
      const lat = parseFloat(hit.lat);
      const lon = parseFloat(hit.lon);
      const label = formatCityLabel(String(hit.display_name || s).split(',').slice(0,2).join(','));
      if (Number.isFinite(lat) && Number.isFinite(lon)) return { lat, lon, label };
    }
  } catch (_) {}

  throw new Error("Could not find location: " + s);
}

/* =========================
   SCROLL ONCE (stop at end)
========================= */
function startScrollOnce(id) {
  const el = document.getElementById(id);
  if (!el) return;
  // reset
  el.style.transition = "none";
  el.style.transform = "translateY(0)";

  requestAnimationFrame(() => {
    const totalHeight = el.scrollHeight;
    const containerHeight = el.parentElement?.clientHeight || 250;
    const dist = totalHeight - containerHeight;
    if (dist <= 0) return;
    const duration = Math.max(4000, dist * 25); // min 4s
    requestAnimationFrame(() => {
      el.style.transition = `transform ${duration}ms linear`;
      el.style.transform = `translateY(-${dist}px)`;
    });
  });
}

async function getWeather(showLoader) {
  const cityInput = document.getElementById("cityInput").value || "Charlotte, NC";

  // Easter eggs
  if (cityInput.trim().toLowerCase() === "bfdi") { showBFDIPicker(); return; }
  if (cityInput.trim().toLowerCase() === "minecraft") { loadMinecraft(); return; }

  const loader = document.getElementById("loading-screen");

  if (showLoader) {
    loader.innerText = "Loading Data...";
    loader.style.display = "flex";
  }

  if (!musicStarted) { shuffleMusic(); playNextTrack(); musicStarted = true; }
  else { audioPlayer.muted = muted; audioPlayer.play().catch(()=>{}); }

  try {
    loader.innerText = "Finding location...";
    const loc = await parseInputToLatLon(cityInput);
    currentCoords = { lat: loc.lat, lon: loc.lon };
    document.getElementById("loc-name").innerText = loc.label;

    loader.innerText = "Contacting NWS...";
    activeRegionName = pickRegionByLatLon(currentCoords.lat, currentCoords.lon);

    const pData = await fetch(`https://api.weather.gov/points/${currentCoords.lat},${currentCoords.lon}`).then(r => r.json());
    pointMeta.forecastHourlyUrl = pData?.properties?.forecastHourly || null;
    pointMeta.stationsUrl = pData?.properties?.observationStations || null;
    if (!pointMeta.forecastHourlyUrl) throw new Error("NWS does not cover this location (US only)");

    loader.innerText = "Loading forecast...";
    await refreshNwsData(true);

    if (showLoader) loader.style.display = "none";
    setPage("current");
    pageIndex = 0;
    startLoop();

    startPolling();
  } catch (e) {
    console.error(e);
    if (showLoader) loader.innerText = "ERROR LOADING DATA\n" + String(e && e.message ? e.message : e);
  }
}

async function refreshNwsData(forceRepaint) {
  if (!pointMeta.forecastHourlyUrl) return;

  const wData = await (await fetch(pointMeta.forecastHourlyUrl, { cache:"no-store" })).json();
  const periods = wData?.properties?.periods || [];
  hourlyData = periods;
    if (typeof periods?.[0]?.isDaytime === 'boolean') isDaytimeNow = periods[0].isDaytime;

  // set true night/day from NWS
  if (periods?.[0]?.isDaytime !== undefined) isDaytimeNow = !!periods[0].isDaytime;

  const newForecastStamp = periods?.[0]?.startTime || null;

  await refreshObservation();

  const changed =
    (newForecastStamp && newForecastStamp !== lastForecastUpdateStamp) ||
    (lastObsUpdateStamp && lastObsUpdateStamp !== (latestObs?.timestamp || latestObs?.observationTime || null));

  if (forceRepaint || changed) {
    lastForecastUpdateStamp = newForecastStamp || lastForecastUpdateStamp;
    updateCurrentConditionsBox();
    if (pageList[pageIndex] === "hourly") renderHourly();
    if (pageList[pageIndex] === "local-obs") renderLocalObs();
    if (pageList[pageIndex] === "travel") renderTravel();
    if (pageList[pageIndex] === "regional-obs") updateRegionalDisplay();
  }

  const now = new Date();
  document.getElementById("last-update").innerText = now.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
}

async function refreshObservation() {
  if (!pointMeta.stationsUrl) return;

  const stationsData = await (await fetch(pointMeta.stationsUrl, { cache:"no-store" })).json();
  const firstStation = stationsData?.features?.[0]?.properties?.stationIdentifier;
  if (!firstStation) { latestObs = null; return; }

  // Station meta for "transmitter" label
  if (firstStation !== currentStationId) {
    currentStationId = firstStation;
    currentStationName = null;
    try {
      const sMeta = await (await fetch(`https://api.weather.gov/stations/${firstStation}`, { cache:"no-store" })).json();
      currentStationName = sMeta?.properties?.name || null;
    } catch {}
  }

  const obsData = await (await fetch(`https://api.weather.gov/stations/${firstStation}/observations/latest`, { cache:"no-store" })).json();
  latestObs = obsData?.properties || null;
  lastObsUpdateStamp = latestObs?.timestamp || latestObs?.observationTime || lastObsUpdateStamp;
}

function updateCurrentConditionsBox() {
  const now = hourlyData?.[0];
  if (!now) return;

  const tempF = now.temperature ?? null;
  const windTxt = (now.windSpeed && now.windDirection) ? `Wind: ${now.windDirection} ${now.windSpeed}` : "Wind: --";
  document.getElementById("wind-subtext").innerText = windTxt;

  document.getElementById("temp-value").innerText = (tempF != null ? tempF : "--") + "°";
  document.getElementById("cond-text").innerText = titleCaseCond(now.shortForecast || "—");

  const icon = getGifName(now.shortForecast);
  document.getElementById("weather-icon").src = icon;

  let windMph = null;
  if (latestObs?.windSpeed?.value != null) windMph = mphFromKph(latestObs.windSpeed.value);
  else if (typeof now.windSpeed === "string") {
    const m = now.windSpeed.match(/(\d+)/);
    if (m) windMph = parseInt(m[1], 10);
  }

  const wc = calcWindChillF(tempF, windMph);
  const ceiling = ceilingFromObs(latestObs);

  const stats = document.getElementById("stats");
  const rh = (latestObs?.relativeHumidity?.value != null) ? (Math.round(latestObs.relativeHumidity.value) + "%") : "--";
  const dp = (latestObs?.dewpoint?.value != null) ? (fFromC(latestObs.dewpoint.value) + "°") : "--";
  const pres = (latestObs?.barometricPressure?.value != null) ? (Math.round(latestObs.barometricPressure.value/100) + " MB") : "--";

stats.innerHTML =
  `Humidity: ${rh}<br>` +
  `Dewpoint: ${dp}<br>` +
  `Pressure: ${pres}<br>` +
  `Ceiling: ${ceiling}<br>` +
  `Wind Chill: ${wc != null ? (wc + "°") : "--"}`;
}

function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try { await refreshNwsData(false); } catch (e) { console.error(e); }
  }, POLL_MINS * 60 * 1000);
}
async function manualRefresh() {
  try { await refreshNwsData(true); } catch (e) { console.error(e); }
}

/* =========================
   TRAVEL CITIES (fixed list)
========================= */
async function loadTravelCities(list) {
  const out = [];
  const batchSize = 4;
  for (let i = 0; i < list.length; i += batchSize) {
    const batch = list.slice(i, i + batchSize);
    const results = await Promise.all(batch.map(async item => {
      try {
        const loc = await parseInputToLatLon(item.q);
        const lat = loc.lat, lon = loc.lon;

        const pData = await fetch(`https://api.weather.gov/points/${lat},${lon}`, { cache:"no-store" }).then(r=>r.json());
        const fh = pData?.properties?.forecastHourly;
        const fd = pData?.properties?.forecast;
        if (!fh) throw new Error("no forecastHourly");

        const [wData, dData] = await Promise.all([
          fetch(fh, { cache:"no-store" }).then(r=>r.json()),
          fd ? fetch(fd, { cache:"no-store" }).then(r=>r.json()) : Promise.resolve(null)
        ]);
        const now = wData?.properties?.periods?.[0];
        const periods = dData?.properties?.periods || [];
        const nightPeriod = periods.find(p => !p.isDaytime) || periods[1] || null;
        const low = nightPeriod?.temperature ?? "--";
        const temp = now?.temperature ?? "--";
        const isDay = (typeof now?.isDaytime === "boolean") ? now.isDaytime : true;
        const icon = getGifName(now?.shortForecast || "Cloudy", true, isDay);
        const cond = titleCaseCond(now?.shortForecast || "--");

        return { city: item.city, temp, low, icon, cond };
      } catch {
        return { city: item.city, temp: "--", low: "--", icon: getGifName("Cloudy", true, true), cond: "--" };
      }
    }));
    out.push(...results);
  }
  return out;
}
