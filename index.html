<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>WeatherSTAR 4000+</title>

<!-- ============================================================
     FONT PRELOAD (ADDED)
     GitHub Pages + cross-origin font hosting can be flaky.
     Preloading + crossorigin helps when the font server allows it.
     If the host blocks CORS, the ONLY guaranteed fix is to self-host
     the font in your GitHub repo and point @font-face to ./Star4000.ttf
     (but I'm not changing your URL since you said don't remove anything).
============================================================ -->
<link rel="preload" href="https://wsbylunv.neocities.org/Star4000.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preconnect" href="https://wsbylunv.neocities.org" crossorigin>
<link rel="dns-prefetch" href="https://wsbylunv.neocities.org">

<style>
@font-face {
  font-family: 'Star4000';
  src: url('https://wsbylunv.neocities.org/Star4000.ttf') format('truetype');
  font-display: block;
}

/* ============================================================
   EXTRA FONT-FACE (ADDED)
   Some browsers behave better if you declare the same face twice with
   a cache-buster path as a fallback. This does NOT remove your original.
   (If the server rejects querystrings, it will just fail harmlessly.)
============================================================ */
@font-face {
  font-family: 'Star4000';
  src: url('https://wsbylunv.neocities.org/Star4000.ttf?v=4000') format('truetype');
  font-display: block;
}

/* ============================================================ */
:root {
  --clock-top:   8px;
  --clock-right: 12px;
  --city-top:    100px;
  --city-right:  20px;
  --city-size:   1.3rem;
  --temp-top:    130px;
  --temp-left:   32px;
  --temp-size:   2.8rem;
  --cond-top:    210px;
  --cond-left:   32px;
  --cond-size:   1.3rem;
  --wind-top:    310px;
  --wind-left:   32px;
  --wind-size:   1.1rem;
  --details-top: 105px;
  --details-left:310px;
  --lbl-left:    0px;
  --lbl-size:    1.1rem;
  --val-offset:  160px;
  --val-size:    1.1rem;
  --row-height:  1.9rem;
  --bottom-size: 1.1rem;
}
/* ============================================================ */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Star4000", sans-serif !important;
}

/* ============================================================
   HARD FORCE ON ROOT ELEMENTS (ADDED)
   Ensures default inheritance starts from the top of the tree.
============================================================ */
html, body {
  font-family: "Star4000", sans-serif !important;
}

body {
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

#screen {
  position: relative;
  width: 640px;
  height: 512px;
  background: url('https://wsbylunv.neocities.org/ws4000_bg.png') center/100% 100% no-repeat;
  background-color: #000a2a;
  overflow: hidden;
}

/* CLOCK */
#clock {
  position: absolute;
  top: var(--clock-top);
  right: var(--clock-right);
  text-align: right;
  color: #fff;
}
#clock .time { font-size: 1.2rem; }
#clock .date { font-size: 0.95rem; }

/* CITY */
#city-name {
  position: absolute;
  top: var(--city-top);
  right: var(--city-right);
  color: #ffe600;
  font-size: var(--city-size);
  text-align: right;
  max-width: 280px;
}

/* TEMP */
#cur-temp {
  position: absolute;
  top: var(--temp-top);
  left: var(--temp-left);
  color: #fff;
  font-size: var(--temp-size);
}

/* CONDITION */
#cur-cond {
  position: absolute;
  top: var(--cond-top);
  left: var(--cond-left);
  color: #fff;
  font-size: var(--cond-size);
}

/* WIND */
#cur-wind {
  position: absolute;
  top: var(--wind-top);
  left: var(--wind-left);
  color: #fff;
  font-size: var(--wind-size);
}

/* DETAILS */
#details {
  position: absolute;
  top: var(--details-top);
  left: var(--details-left);
  display: flex;
  flex-direction: column;
}

.drow {
  position: relative;
  height: var(--row-height);
  color: #fff;
}
.drow .lbl {
  position: absolute;
  left: var(--lbl-left);
  font-size: var(--lbl-size);
}
.drow .val {
  position: absolute;
  left: var(--val-offset);
  font-size: var(--val-size);
}

/* BOTTOM */
#bottom-text {
  position: absolute;
  bottom: 18px;
  left: 0;
  right: 0;
  text-align: center;
  color: #fff;
  font-size: var(--bottom-size);
}

/* SEARCH OVERLAY */
#search-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  z-index: 20;
}

#search-overlay input {
  background: rgba(0,0,20,0.85);
  border: 2px solid #4af;
  color: #4af;
  font-size: 1rem;
  padding: 6px 14px;
  outline: none;
  width: 260px;
}
#search-overlay input::placeholder { color: #336; }
#search-overlay button {
  background: #1a3fc4;
  color: #fff;
  border: 2px solid #4af;
  font-size: 1rem;
  padding: 6px 20px;
  cursor: pointer;
}
#search-overlay button:hover { background: #4af; color: #000; }

#status-msg { color: #4af; font-size: 0.9rem; letter-spacing: 2px; min-height: 1.2em; }
#status-msg.error { color: #f44; }

/* INLINE SEARCH */
#inline-search {
  position: absolute;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  z-index: 10;
}
#inline-search input {
  background: rgba(0,0,20,0.75);
  border: 1px solid #4af;
  color: #4af;
  font-size: 0.85rem;
  padding: 3px 10px;
  outline: none;
  width: 200px;
}
#inline-search input::placeholder { color: #335; }
#inline-search button {
  background: rgba(26,63,196,0.8);
  color: #fff;
  border: 1px solid #4af;
  font-size: 0.85rem;
  padding: 3px 10px;
  cursor: pointer;
}

.blink { animation: blink 1.1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* FINAL LOCK */
html, body, #screen, #screen *,
input, button, span, div, p {
  font-family: "Star4000", sans-serif !important;
}

/* ============================================================
   NUCLEAR OVERRIDES (ADDED)
   Some browsers apply form-control fonts separately. This catches them.
============================================================ */
input, button, textarea, select, option {
  font-family: "Star4000", sans-serif !important;
  -webkit-font-smoothing: none;
  text-rendering: geometricPrecision;
}

/* ============================================================
   NOTE (ADDED)
   If the font host blocks cross-origin fonts (CORS), NO amount of JS
   can “force” the browser to use the font. In that case, self-host the
   .ttf in your GitHub repo and change the src to a relative path.
============================================================ */
</style>
</head>

<body>
<div id="screen">

  <!-- Clock -->
  <div id="clock">
    <div class="time" id="clock-time">--:-- --</div>
    <div class="date" id="clock-date">--- --- --</div>
  </div>

  <!-- Weather Data -->
  <div id="weather-data" style="display:none;">
    <div id="city-name"></div>
    <div id="cur-temp"></div>
    <div id="cur-cond"></div>
    <div id="cur-wind">Wind: <span id="wind-val"></span></div>
    <div id="details">
      <div class="drow"><span class="lbl">Humidity:</span><span class="val" id="d-hum"></span></div>
      <div class="drow"><span class="lbl">Dewpoint:</span><span class="val" id="d-dew"></span></div>
      <div class="drow"><span class="lbl">Visibility:</span><span class="val" id="d-vis"></span></div>
      <div class="drow"><span class="lbl">Pressure:</span><span class="val" id="d-pres"></span></div>
      <div class="drow"><span class="lbl">Heat Index:</span><span class="val" id="d-hi"></span></div>
      <div class="drow"><span class="lbl">Wind Chill:</span><span class="val" id="d-wc"></span></div>
    </div>
    <div id="bottom-text">Conditions at <span id="bottom-city"></span></div>
    <div id="inline-search">
      <input id="city-input2" type="text" placeholder="Search another city..." />
      <button id="search-btn2">GO</button>
    </div>
  </div>

  <!-- Idle search overlay -->
  <div id="search-overlay">
    <input id="city-input" type="text" placeholder="ENTER A US CITY..." autocomplete="off" spellcheck="false" />
    <button id="search-btn">GET FORECAST</button>
    <div id="status-msg" class="blink">ENTER A CITY TO BEGIN</div>
  </div>

</div>

<script>
// ── Font force ──
async function forceStarFont() {
  try {
    await document.fonts.load('1em "Star4000"');
    await document.fonts.ready;
    document.querySelectorAll('*').forEach(el => {
      el.style.setProperty('font-family', '"Star4000", sans-serif', 'important');
    });
  } catch(e) { console.warn('Star4000 font force failed:', e); }
}
window.addEventListener('load', forceStarFont);

/* ============================================================
   INFINITE FONT ENFORCER (ADDED)
   - Re-applies font forever (interval + RAF + idle callback)
   - Observes DOM changes and enforces on new nodes
   - Tries a direct FontFace() load as an extra kick
   This DOES NOT remove anything you already had.
============================================================ */

// A very small utility to avoid spamming the same style repeatedly too hard
const __STAR_FONT = '"Star4000", sans-serif';
const __STAR_PROP = 'font-family';

// Apply font to one element with !important
function __applyStarToEl(el) {
  if (!el || !el.style) return;
  el.style.setProperty(__STAR_PROP, __STAR_FONT, 'important');
}

// Apply font to document root + common form controls
function __applyStarToRoots() {
  try {
    __applyStarToEl(document.documentElement);
    __applyStarToEl(document.body);
    // Also set as inline style on #screen if present
    const screen = document.getElementById('screen');
    if (screen) __applyStarToEl(screen);
  } catch (e) {}
}

// Apply font to EVERYTHING currently in DOM
function __applyStarToAllNow() {
  try {
    __applyStarToRoots();
    document.querySelectorAll('*').forEach(__applyStarToEl);
  } catch (e) {}
}

// Try to load font via FontFace API (extra kick, especially if fonts.load is flaky)
async function __kickFontFaceLoad() {
  try {
    if (!('FontFace' in window) || !document.fonts) return;

    // Attempt both URLs (with and without cache bust)
    const urls = [
      'https://wsbylunv.neocities.org/Star4000.ttf',
      'https://wsbylunv.neocities.org/Star4000.ttf?v=4000'
    ];

    for (const u of urls) {
      try {
        const ff = new FontFace('Star4000', `url(${u})`, { style: 'normal', weight: '400' });
        const loaded = await ff.load();
        document.fonts.add(loaded);
      } catch (e) {
        // Ignore and try next
      }
    }
  } catch (e) {}
}

// Repeatedly ask the browser to “touch” the font so it stays alive
async function __keepRequestingFont() {
  // Try multiple sizes so browsers that key cache weirdly still load it
  const samples = [
    '0.5em "Star4000"',
    '1em "Star4000"',
    '2em "Star4000"',
    '16px "Star4000"',
    '24px "Star4000"'
  ];
  for (const s of samples) {
    try { await document.fonts.load(s); } catch (e) {}
  }
}

// Mutation observer: any new node gets forced immediately
let __starObserver = null;
function __startStarObserver() {
  try {
    if (__starObserver) return;
    __starObserver = new MutationObserver((mutations) => {
      for (const m of mutations) {
        if (m.type === 'childList') {
          m.addedNodes && m.addedNodes.forEach(node => {
            if (!node) return;
            if (node.nodeType === 1) {
              __applyStarToEl(node);
              // If a subtree was added, apply to its children too
              try {
                node.querySelectorAll && node.querySelectorAll('*').forEach(__applyStarToEl);
              } catch (e) {}
            }
          });
        } else if (m.type === 'attributes') {
          // If style/class changes, re-assert font
          if (m.target && m.target.nodeType === 1) __applyStarToEl(m.target);
        }
      }
    });

    __starObserver.observe(document.documentElement, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ['style', 'class']
    });
  } catch (e) {}
}

// RAF loop: every frame (or close), keep enforcing roots lightly
function __rafStarLoop() {
  try { __applyStarToRoots(); } catch (e) {}
  requestAnimationFrame(__rafStarLoop);
}

// Idle loop: when idle, enforce everything
function __idleStarLoop() {
  try { __applyStarToAllNow(); } catch (e) {}
  if ('requestIdleCallback' in window) {
    requestIdleCallback(__idleStarLoop, { timeout: 1000 });
  } else {
    setTimeout(__idleStarLoop, 900);
  }
}

// Interval loop: the “infinity” hammer (kept moderate to avoid freezing)
function __intervalStarLoop() {
  __applyStarToAllNow();
  __keepRequestingFont();
  __kickFontFaceLoad();
}

// Boot the nuclear font system ASAP
(function __bootInfiniteFontForce() {
  // Start observer immediately
  __startStarObserver();

  // Immediate apply
  __applyStarToAllNow();

  // Start loops
  requestAnimationFrame(__rafStarLoop);
  if ('requestIdleCallback' in window) requestIdleCallback(__idleStarLoop, { timeout: 1000 });
  else setTimeout(__idleStarLoop, 900);

  // Infinite interval: every 600ms enforce all + attempt loads
  setInterval(__intervalStarLoop, 600);

  // Also do a burst in the first few seconds
  let bursts = 0;
  const burstTimer = setInterval(() => {
    bursts++;
    __applyStarToAllNow();
    __keepRequestingFont();
    if (bursts >= 10) clearInterval(burstTimer);
  }, 250);

  // Another enforcement on full load
  window.addEventListener('load', () => {
    __applyStarToAllNow();
    __keepRequestingFont();
    __kickFontFaceLoad();
  });

  // And when tab becomes visible again
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      __applyStarToAllNow();
      __keepRequestingFont();
      __kickFontFaceLoad();
    }
  });
})();

/* ============================================================
   OPTIONAL DEBUG (ADDED, DOES NOTHING VISUALLY)
   You can open DevTools console to see if the font is considered loaded.
============================================================ */
function __logFontStatusOnce() {
  try {
    if (document.fonts && document.fonts.check) {
      const ok = document.fonts.check('16px "Star4000"');
      console.log('[WS4000+] Star4000 font loaded?', ok);
    }
  } catch (e) {}
}
setTimeout(__logFontStatusOnce, 1200);
setTimeout(__logFontStatusOnce, 3500);
setTimeout(__logFontStatusOnce, 7000);

// ── API ──
async function getCoordinates(city) {
  const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1`, {
    headers: { 'User-Agent': 'WS4000Plus-Emulator' }
  });
  const data = await res.json();
  if (!data.length) throw new Error('City not found');
  return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
}

async function getWeatherForCity(city) {
  const { lat, lon } = await getCoordinates(city);
  const ptRes = await fetch(`https://api.weather.gov/points/${lat.toFixed(4)},${lon.toFixed(4)}`, {
    headers: { 'User-Agent': 'WS4000Plus-Emulator' }
  });
  if (!ptRes.ok) throw new Error('US cities only');
  const pt = await ptRes.json();
  const [fRes, sRes] = await Promise.all([
    fetch(pt.properties.forecast, { headers: { 'User-Agent': 'WS4000Plus-Emulator' } }),
    fetch(pt.properties.observationStations, { headers: { 'User-Agent': 'WS4000Plus-Emulator' } })
  ]);
  const fData = await fRes.json();
  const sData = await sRes.json();
  const stationId = sData.features[0].properties.stationIdentifier;
  const oRes = await fetch(`https://api.weather.gov/stations/${stationId}/observations/latest`, {
    headers: { 'User-Agent': 'WS4000Plus-Emulator' }
  });
  const obs = oRes.ok ? (await oRes.json()).properties : null;
  const cToF = c => c != null ? Math.round(c * 9/5 + 32) : null;
  const mToMi = m => m != null ? (m / 1609.34).toFixed(1) : null;
  const paToInHg = p => p != null ? (p / 3386.39).toFixed(2) : null;
  const fmt = (v, suf) => v != null ? v + suf : 'N/A';
  const cur = fData.properties.periods[0];
  return {
    location:   `${pt.properties.relativeLocation.properties.city}, ${pt.properties.relativeLocation.properties.state}`,
    temp:       fmt(obs ? cToF(obs.temperature?.value) : cur.temperature, '°'),
    condition:  obs?.textDescription || cur.shortForecast,
    wind:       cur.windSpeed + ' ' + cur.windDirection,
    humidity:   fmt(obs?.relativeHumidity?.value != null ? Math.round(obs.relativeHumidity.value) : null, '%'),
    dewpoint:   fmt(obs?.dewpoint?.value != null ? cToF(obs.dewpoint.value) : null, '°'),
    visibility: fmt(obs?.visibility?.value != null ? mToMi(obs.visibility.value) : null, ' mi.'),
    pressure:   fmt(obs?.barometricPressure?.value != null ? paToInHg(obs.barometricPressure.value) : null, ''),
    heatIndex:  fmt(obs?.heatIndex?.value != null ? cToF(obs.heatIndex.value) : null, '°'),
    windChill:  fmt(obs?.windChill?.value != null ? cToF(obs.windChill.value) : null, '°'),
  };
}

// ── Clock ──
const DAYS   = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function updateClock() {
  const n = new Date();
  let h = n.getHours(), m = n.getMinutes(), s = n.getSeconds(), ap = 'AM';
  if (h >= 12) ap = 'PM';
  if (h > 12) h -= 12;
  if (h === 0) h = 12;
  document.getElementById('clock-time').textContent = `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} ${ap}`;
  document.getElementById('clock-date').textContent = `${DAYS[n.getDay()]} ${MONTHS[n.getMonth()]} ${n.getDate()}`;
}
updateClock();
setInterval(updateClock, 1000);

// ── UI ──
function setStatus(msg, isError=false, blink=false) {
  const el = document.getElementById('status-msg');
  el.className = isError ? 'error' : (blink ? 'blink' : '');
  el.textContent = msg;
}

function showWeather(data) {
  document.getElementById('search-overlay').style.display = 'none';
  document.getElementById('weather-data').style.display  = 'block';
  document.getElementById('city-name').textContent   = data.location;
  document.getElementById('cur-temp').textContent    = data.temp;
  document.getElementById('cur-cond').textContent    = data.condition;
  document.getElementById('wind-val').textContent    = data.wind;
  document.getElementById('d-hum').textContent       = data.humidity;
  document.getElementById('d-dew').textContent       = data.dewpoint;
  document.getElementById('d-vis').textContent       = data.visibility;
  document.getElementById('d-pres').textContent      = data.pressure;
  document.getElementById('d-hi').textContent        = data.heatIndex;
  document.getElementById('d-wc').textContent        = data.windChill;
  document.getElementById('bottom-city').textContent = data.location;
}

async function doSearch(cityVal) {
  const input = (cityVal || document.getElementById('city-input').value).trim();
  if (!input) return;
  if (input.toLowerCase() === 'bfdi')      { setStatus('BFDI MODE — COMING SOON', false, true); return; }
  if (input.toLowerCase() === 'minecraft') { setStatus('MINECRAFT MODE — COMING SOON', false, true); return; }
  setStatus('FETCHING...', false, true);
  try { showWeather(await getWeatherForCity(input)); }
  catch(e) { setStatus(e.message.toUpperCase(), true); }
}

document.getElementById('search-btn').addEventListener('click', () => doSearch());
document.getElementById('city-input').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
document.getElementById('search-btn2').addEventListener('click', () => {
  const v = document.getElementById('city-input2').value.trim();
  if (!v) return;
  document.getElementById('weather-data').style.display = 'none';
  document.getElementById('search-overlay').style.display = 'flex';
  doSearch(v);
});
document.getElementById('city-input2').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const v = document.getElementById('city-input2').value.trim();
  if (!v) return;
  document.getElementById('weather-data').style.display = 'none';
  document.getElementById('search-overlay').style.display = 'flex';
  doSearch(v);
});
</script>
</body>
</html>
