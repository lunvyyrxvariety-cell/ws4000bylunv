<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeatherSTAR 4000+</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap');

    :root {
      --blue: #0a1a6e;
      --cyan: #00cfff;
      --yellow: #ffe600;
      --white: #ffffff;
      --gray: #b0b8c8;
      --red: #e00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'VT323', monospace;
      color: var(--white);
    }

    #screen {
      position: relative;
      width: 640px;
      border: 6px solid #222;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 60px #0a1a6e88, 0 0 10px #000;
    }

    /* ── HEADER BAR ── */
    #header {
      background: var(--blue);
      border-bottom: 3px solid var(--cyan);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      position: relative;
      z-index: 10;
    }

    #header .logo {
      font-size: 1.4rem;
      color: var(--yellow);
      letter-spacing: 2px;
      text-shadow: 0 0 8px var(--yellow);
    }

    #header .clock {
      font-size: 1.3rem;
      color: var(--cyan);
      font-family: 'Share Tech Mono', monospace;
    }

    /* ── MAIN DISPLAY (bg image) ── */
    #main {
      position: relative;
      min-height: 420px;
      background: url('https://wsbylunv.neocities.org/ws4000_bg.png') center center / cover no-repeat;
      display: flex;
      flex-direction: column;
    }

    /* Search input floated over bg */
    #search-bar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 10;
    }

    #city-input {
      background: rgba(0,0,20,0.75);
      border: 2px solid var(--cyan);
      color: var(--cyan);
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      padding: 4px 10px;
      outline: none;
      caret-color: var(--cyan);
      width: 220px;
    }

    #city-input::placeholder { color: #448; }

    #search-btn {
      background: rgba(10,26,110,0.85);
      color: var(--white);
      border: 2px solid var(--cyan);
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      padding: 4px 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #search-btn:hover { background: var(--cyan); color: #000; }

    /* Weather overlay content */
    #weather-overlay {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      z-index: 5;
    }

    #location-bar {
      font-size: 1.6rem;
      color: var(--yellow);
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 #000, 0 0 10px #000;
      display: none;
      margin-bottom: 6px;
    }

    #cur-temp {
      font-size: 4.5rem;
      color: var(--white);
      text-shadow: 2px 2px 0 #000, 0 0 16px #000;
      line-height: 1;
    }

    #cur-cond {
      font-size: 1.5rem;
      color: var(--white);
      text-shadow: 1px 1px 0 #000;
      margin-top: 2px;
    }

    #cur-details {
      margin-top: 6px;
      font-size: 1rem;
      color: var(--gray);
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      text-shadow: 1px 1px 0 #000;
    }

    #forecast-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .f-card {
      background: rgba(10,26,110,0.7);
      border: 1px solid rgba(0,207,255,0.4);
      padding: 5px 8px;
      text-align: center;
    }

    .f-card .f-name { font-size: 0.85rem; color: var(--cyan); }
    .f-card .f-temp { font-size: 1.5rem; color: var(--yellow); }
    .f-card .f-cond { font-size: 0.75rem; color: var(--gray); font-family: 'Share Tech Mono', monospace; line-height: 1.2; margin-top: 2px; }

    /* Status/idle */
    #status {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 380px;
      font-size: 1.2rem;
      color: var(--gray);
      letter-spacing: 2px;
      flex-direction: column;
      gap: 10px;
      text-shadow: 1px 1px 0 #000;
    }

    .blink { animation: blink 1.1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .error-msg { color: var(--red); font-size: 1.1rem; letter-spacing: 1px; }
  </style>
</head>
<body>

<div id="screen">

  <!-- Header -->
  <div id="header">
    <div class="logo">☁ WEATHERSTAR 4000+</div>
    <div class="clock" id="clock">--:-- --</div>
  </div>

  <!-- Search -->
  <div id="search-bar">
    <input id="city-input" type="text" placeholder="ENTER CITY..." autocomplete="off" spellcheck="false" />
    <button id="search-btn">GO</button>
  </div>

  <!-- Main display -->
  <div id="main">

    <!-- Status / idle -->
    <div id="status">
      <div class="blink" style="color:var(--cyan); font-size:1rem; letter-spacing:3px;">ENTER A CITY BELOW</div>
    </div>

    <!-- Weather overlay -->
    <div id="weather-overlay" style="display:none;">
      <div id="location-bar"></div>
      <div id="cur-temp"></div>
      <div id="cur-cond"></div>
      <div id="cur-details"></div>
      <div id="forecast-grid"></div>
    </div>

    <!-- Search input overlaid at bottom -->
    <div id="search-bar">
      <input id="city-input" type="text" placeholder="ENTER CITY..." autocomplete="off" spellcheck="false" />
      <button id="search-btn">GO</button>
    </div>

  </div>

</div>

<script src="weather.js"></script>
<script>
  // ── Clock ──
  function updateClock() {
    const now = new Date();
    let h = now.getHours(), m = now.getMinutes(), ampm = 'AM';
    if (h >= 12) ampm = 'PM';
    if (h > 12) h -= 12;
    if (h === 0) h = 12;
    document.getElementById('clock').textContent =
      `${h}:${String(m).padStart(2,'0')} ${ampm}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── UI helpers ──
  function showStatus(msg, isError = false) {
    document.getElementById('status').style.display = 'flex';
    document.getElementById('weather-overlay').style.display = 'none';
    document.getElementById('status').innerHTML = `<div class="${isError ? 'error-msg' : 'blink'}" style="color:${isError ? 'var(--red)' : 'var(--cyan)'}; font-size:1rem; letter-spacing:3px;">${msg}</div>`;
  }

  function showWeather(data) {
    document.getElementById('status').style.display = 'none';
    document.getElementById('weather-overlay').style.display = 'block';

    const cur = data.current;
    document.getElementById('location-bar').textContent = data.location.toUpperCase();
    document.getElementById('location-bar').style.display = 'block';
    document.getElementById('cur-temp').textContent = `${cur.temperature}°${cur.temperatureUnit}`;
    document.getElementById('cur-cond').textContent = cur.shortForecast;
    document.getElementById('cur-details').innerHTML = `
      <span>WIND: ${cur.windSpeed} ${cur.windDirection}</span>
      <span>HUMIDITY: ${cur.relativeHumidity ? cur.relativeHumidity.value + '%' : 'N/A'}</span>
      <span>${cur.isDaytime ? 'DAY' : 'NIGHT'}</span>
    `;

    const grid = document.getElementById('forecast-grid');
    grid.innerHTML = '';
    data.periods.slice(0, 8).forEach(p => {
      const card = document.createElement('div');
      card.className = 'f-card';
      card.innerHTML = `
        <div class="f-name">${p.name.toUpperCase()}</div>
        <div class="f-temp">${p.temperature}°${p.temperatureUnit}</div>
        <div class="f-cond">${p.shortForecast}</div>`;
      grid.appendChild(card);
    });
  }

  // ── Search ──
  async function doSearch() {
    const input = document.getElementById('city-input').value.trim();
    if (!input) return;

    // Easter egg check
    if (input.toLowerCase() === 'bfdi') {
      // TODO: BFDI location picker
      showStatus('🌟 BFDI MODE — COMING SOON', false);
      return;
    }
    if (input.toLowerCase() === 'minecraft') {
      // TODO: Minecraft mode
      showStatus('⛏ MINECRAFT MODE — COMING SOON', false);
      return;
    }

    showStatus('<span class="blink">FETCHING FORECAST...</span>');
    try {
      const data = await getWeatherForCity(input);
      showWeather(data);
    } catch (e) {
      showStatus(e.message.toUpperCase(), true);
    }
  }

  document.getElementById('search-btn').addEventListener('click', doSearch);
  document.getElementById('city-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });
</script>

</body>
</html>
